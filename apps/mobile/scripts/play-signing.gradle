// Applied only by the local Play build; credentials never enter the generated project.
gradle.beforeProject { app ->
  app.plugins.withId('com.android.application') {
   app.extensions.getByName('androidComponents').finalizeDsl { android ->
    def signing = android.signingConfigs.create('agentUpload')
    signing.storeFile = new File(System.getenv('AGENT_UPLOAD_STORE_FILE'))
    signing.storePassword = System.getenv('AGENT_UPLOAD_PASSWORD')
    signing.keyAlias = 'agent-upload'
    signing.keyPassword = System.getenv('AGENT_UPLOAD_PASSWORD')
    android.buildTypes.release.signingConfig = signing
   }
  }
}
